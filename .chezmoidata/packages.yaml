# Package lists, read by run_onchange_install-packages.sh.tmpl and ~/.local/bin/pkg-drift.
# A group with `profiles:` installs only on those profiles; without it, everywhere.
packages:
  base:
    official:
      - amd-ucode
      - base
      - base-devel
      - btrfs-progs
      - dosfstools
      - efibootmgr
      - framework-system
      - fwupd
      - git
      - linux
      - linux-firmware
      - man-db
      - mesa
      - sudo
      - vulkan-radeon
      - zram-generator
    aur:
      - yay-bin

  system:
    official:
      - bluez
      - bluez-utils
      - clamav
      - kernel-modules-hook
      - networkmanager
      - nftables
      - pacman-contrib
      - power-profiles-daemon
      - snap-pac
      - snapper
      - sof-firmware
      - udisks2
      - wireguard-tools

  audio:
    official:
      - pipewire
      - pipewire-alsa
      - pipewire-audio
      - pipewire-pulse
      - pulsemixer
      - wireplumber

  desktop:
    official:
      - brightnessctl
      - cliphist
      - ddcutil
      - fuzzel
      - ghostty
      - gpu-screen-recorder
      - grim
      - hypridle
      - hyprland
      - hyprlock
      - hyprpolkitagent
      - python-gobject
      - rofimoji
      - satty
      - slurp
      - swaybg
      - swayimg
      - udiskie
      - uwsm
      - wl-clipboard
      - wl-mirror
      - wtype
      - xdg-desktop-portal-hyprland
      - xdg-terminal-exec
    aur:
      - ddcutil-service
      - hyprmoncfg
      - kanata-bin
      - omni-launcher
      - omni-shell
      - strata-bin
      - wifitui

  fonts:
    official:
      - noto-fonts
      - noto-fonts-cjk
      - noto-fonts-emoji
      - ttf-jetbrains-mono-nerd

  printing:
    official:
      - cups
      - ghostscript # load-bearing optdep of cups-filters (print.md)
      - gsfonts
      - sane-airscan
      - simple-scan

  cli:
    official:
      - 7zip
      - atuin
      - bat
      - bluetui
      - btop
      - chezmoi
      - cyme
      - dog
      - doggo
      - ffmpeg
      - fzf
      - ghq
      - git-delta
      - git-lfs
      - github-cli
      - gpg-tui
      - imagemagick
      - jq
      - lazygit
      - neovim
      - python-pypdf
      - rbw
      - rclone
      - sops
      - starship
      - tmux
      - vim
      - yazi
      - yt-dlp
      - zoxide
      - zsh
    aur:
      - caligula-bin
      - disktui
      - gonzo
      - rustledger-bin
      - s5cmd-bin

  dev:
    official:
      - git-cliff
      - go
      - go-task
      - hugo
      - markdownlint-cli2
      - nodejs
      - npm
      - opencode
      - pnpm
      - pre-commit
    aur:
      - claude-code

  containers:
    official:
      - fuse-overlayfs
      - podman
      - podman-docker
    aur:
      - kind

  cloud:
    official:
      - azure-cli
      - fluxcd
      - gke-gcloud-auth-plugin
      - google-cloud-cli
      - k9s
      - krew
      - kubectl
      - openbao
      - opentofu
      - talosctl
      - terraform
      - vals
    aur:
      - kubesess-bin

  apps:
    official:
      - audacity
      - chromium
      - firefox
      - gvfs-smb
      - libraw
      - libreoffice-fresh
      - picard
      - prusa-slicer
      - qt6-connectivity
      - signal-desktop
      - strawberry
    aur:
      - kopia-bin
      - localsend-bin
      - masterpdfeditor
      - onlyoffice-bin
      - rustdesk-bin
      - seadrive-gui
      - slack-desktop
      - vial-appimage

  work:
    profiles: [work]
    aur:
      - drata-agent
