#!/usr/bin/nft -f
# fw13 laptop firewall — default-deny inbound, outbound free.
# Installed from ~/.local/share/chezmoi/.root/etc/nftables.conf (.root/README.md).
#
# Owns exactly one table. No `flush ruleset`: that would also nuke rules
# other tools keep in this netns (docker/kind via iptables-nft keep theirs
# in ip-family tables). `destroy` + re-create makes reloads idempotent.

destroy table inet filter

table inet filter {
    # LocalSend inbound scope — a set so it toggles at runtime without
    # re-parsing rules: `sudo localsend-mode <home|open|blocked|status>`
    # (.root/usr/local/sbin/). File default = home (192.168/16 — the home
    # network grows across subnets; named cost: ANY 192.168.x.x network
    # the laptop joins is in scope, hostile wifi on that range included).
    # open = 0.0.0.0/0 (any connected network), 45min auto-revert;
    # blocked = empty set at runtime (all inbound transfers closed,
    # device still announces). Reload and boot reset to home: this file
    # is the source of truth, runtime edits are the toggle, reloads
    # are the reset.
    set localsend_nets {
        type ipv4_addr
        flags interval
        elements = { 192.168.0.0/16 }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept
        iifname "lo" accept

        # DHCP replies can arrive unsolicited (broadcast/multicast
        # flows have no conntrack reverse tuple)
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept

        # ICMPv4: PMTUD errors + ping for debugging
        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem, echo-request } accept

        # ICMPv6: NDP/SLAAC (this machine uses global v6) + PMTUD —
        # v6 has no fragmentation, packet-too-big must never be dropped
        meta l4proto ipv6-icmp icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, echo-request, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, mld-listener-query } accept

        # LocalSend discovery: peers announce over mDNS (_localsend._tcp).
        # Multicast has no conntrack reverse tuple, so peer announcements
        # can't ride the established rule — explicit accept, scoped to the
        # mDNS group + port pair. Outbound queries/announcements ride the
        # free output policy.
        ip daddr 224.0.0.251 udp sport 5353 udp dport 5353 accept

        # LocalSend transfer API (v2: HTTP/WS on 53317) — inbound scope is
        # the localsend_nets SET so it toggles at runtime without touching
        # the ruleset: `sudo localsend-mode home|open|blocked|status`
        # (.root/usr/local/sbin/). An empty set (blocked) matches nothing —
        # the chain policy drops all LocalSend inbound. In-flight
        # transfers survive mode changes via the established rule.
        # v6-only peers are discoverable but can't transfer.
        ip saddr @localsend_nets tcp dport 53317 accept
    }

    chain forward {
        # Not a router. Policy accept so docker/kind FORWARD rules
        # (ip-family chains on the same hook) keep working; a drop
        # policy here would break container networking. Inbound
        # exposure is input's job.
        type filter hook forward priority filter; policy accept;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}