# sane-airscan: manual device entry for the Brother MFC-L8690CDW (see
# print.md at the source root). airscan does NOT read ~/.config/sane.d/ —
# only this file counts, hence root-side.
# The endpoint is what the printer itself advertises (airscan-discover,
# paste-ready syntax) and what the proven test scan used; pinned to IPv4
# for determinism. Built-in WS-Discovery stays enabled as a fallback.
# NOTE: this file is package-owned (sane-airscan) and NOT in its backup
# array — a package upgrade silently overwrites it. Re-install from here.

[devices]
  Brother MFC-L8690CDW = http://192.168.63.30:80/WebServices/ScannerService, WSD