# Passphrases live in RAM only: the agent loses them on restart/reboot.
# Allow presetting passphrases for ~/.local/bin/gpg-unlock, which feeds the
# passphrase from Bitwarden (rbw) into the agent's RAM cache. Preset entries
# never expire (verified) — they vanish with the agent at reboot, or sooner
# via `gpgconf --kill gpg-agent`.
allow-preset-passphrase