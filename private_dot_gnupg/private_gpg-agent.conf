# Passphrases live in RAM only: the agent loses them on restart/reboot.
# Allow presetting passphrases for ~/.local/bin/gpg-unlock, which feeds the
# passphrase from Bitwarden (rbw) into the agent's RAM cache. Preset entries
# are capped by max-cache-ttl — the 2h default silently evicted them during
# overnight suspends (why gpg-unlock kept needing re-runs; the man page's
# "don't expire" wording is misleading, the TTL cap wins). 30 days ≈ "until
# reboot". A SIGHUP (`gpgconf --reload gpg-agent`) also flushes preset
# entries — re-run gpg-unlock after one.
allow-preset-passphrase
max-cache-ttl 2592000