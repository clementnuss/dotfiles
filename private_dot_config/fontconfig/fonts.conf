<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Chromium never falls back for Private Use Area glyphs (Nerd Font icons):
       the font must be in the page's CSS stack, and code stacks end in monospace -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
</fontconfig>
