unbind-key 'C-b'
set -g prefix 'C-Space'
bind-key 'C-Space' send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
# renumber-windows stays off: tilish's Alt+Shift+N needs stable indices
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
# answer OSC 11 background queries, or TUIs guess dark (re-attach after changing)
set -as terminal-features ',xterm-ghostty:background'
set -g allow-passthrough on
set -sg escape-time 10
# lets tmux see Ctrl+Alt+digit (legacy encoding can't express it); apps only get it on request
set -s extended-keys on
set -s extended-keys-format csi-u

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Ctrl+Alt+N: switch to session N, creating it if missing (tilish's Alt+N does windows)
bind -n C-M-1 if-shell 'tmux has-session -t =1' 'switch-client -t =1' 'new-session -s 1'
bind -n C-M-2 if-shell 'tmux has-session -t =2' 'switch-client -t =2' 'new-session -s 2'
bind -n C-M-3 if-shell 'tmux has-session -t =3' 'switch-client -t =3' 'new-session -s 3'
bind -n C-M-4 if-shell 'tmux has-session -t =4' 'switch-client -t =4' 'new-session -s 4'
bind -n C-M-5 if-shell 'tmux has-session -t =5' 'switch-client -t =5' 'new-session -s 5'
bind -n C-M-6 if-shell 'tmux has-session -t =6' 'switch-client -t =6' 'new-session -s 6'
bind -n C-M-7 if-shell 'tmux has-session -t =7' 'switch-client -t =7' 'new-session -s 7'
bind -n C-M-8 if-shell 'tmux has-session -t =8' 'switch-client -t =8' 'new-session -s 8'
bind -n C-M-9 if-shell 'tmux has-session -t =9' 'switch-client -t =9' 'new-session -s 9'

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'jabirali/tmux-tilish'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'laktak/extrakto'

set -g @tilish-enforce 'none'
set -g @tilish-smartsplits 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'
set -g @extrakto_clip_tool "wl-copy"

# catppuccin options must be set before the plugin runs
set -g @catppuccin_flavor 'latte'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_number_color "#{@thm_yellow}"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M:%S"
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

set -g status-position bottom
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

# keep last
run '~/.tmux/plugins/tpm/tpm'
