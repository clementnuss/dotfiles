# Rootless podman storage on an all-btrfs machine: kernel overlayfs cannot
# use btrfs as its upperdir, so layers go through fuse-overlayfs (userspace).
# User config overrides /etc/containers/storage.conf. If $HOME ever moves
# off btrfs, drop mount_program and podman picks kernel overlay again.
# Perf: image pulls/layer extraction pay the FUSE metadata tax (~2-3x);
# named volumes + bind mounts bypass the overlay entirely — hot caches
# (node_modules, go/pkg, DB data) belong in volumes, not the rootfs.
[storage]
driver = "overlay"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"