# sample hypridle.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hypridle

general {
    lock_cmd = pidof hyprlock || hyprlock                             # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                          # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # turn on screen w/o key press after resume.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 150                                          # 2.5min.
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 300
    on-timeout = /home/cjmnuss/.local/bin/idle-guard # docked: screen off, stay unlocked; portable: lock (as before)
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # wake screen on return; no-op if it never slept
}

# 20min: docked lock — wake the screen FIRST, then lock: hyprlock must
# never spawn against a disabled output (SIGABRT — see the note below).
# Portable is already locked at 5min; the extra lock-session is the same
# no-op before_sleep_cmd performs daily when suspending while locked.
listener {
    timeout = 1200
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'; loginctl lock-session
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# INVARIANT (hyprlock 0.9.6 SIGABRTs when the only output is disabled
# while locked — hyprwm/hyprlock#984, #991, #953; it crashed exactly 30s
# after lock): dpms off only ever runs UNLOCKED (the 5min docked branch),
# and every lock path wakes the screen first (20min listener,
# after_sleep_cmd). The 30min suspend darkens the screen by sleeping;
# after_sleep_cmd wakes it.

listener {
    timeout = 1800                                # 30min.
    on-timeout = systemctl suspend                # suspend pc.
}
