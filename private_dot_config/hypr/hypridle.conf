general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Invariant: hyprlock 0.9.6 SIGABRTs on dpms off while locked (hyprwm/hyprlock#984).
# dpms off only ever runs unlocked (idle-guard, docked), every lock path wakes the screen first.

listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 150
    on-timeout = brightnessctl -sd chromeos::kbd_backlight set 0
    on-resume = brightnessctl -rd chromeos::kbd_backlight
}

# docked: screen off, stay unlocked; portable: lock
listener {
    timeout = 300
    on-timeout = /home/cjmnuss/.local/bin/idle-guard
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# docked lock (portable is already locked)
listener {
    timeout = 1200
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'; loginctl lock-session
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
