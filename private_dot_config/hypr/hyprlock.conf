$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    # Catppuccin Latte, matching omni-shell
    inner_color = rgba(239, 241, 245, 0.4)
    outer_color = rgba(136, 57, 239, 1.0) rgba(114, 135, 253, 1.0) 45deg
    check_color = rgba(30, 102, 245, 1.0)
    fail_color = rgba(210, 15, 57, 1.0) rgba(234, 118, 203, 1.0) 40deg
    capslock_color = rgba(223, 142, 29, 1.0)
    font_color = rgb(76, 79, 105)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}
