# fuzzel: Catppuccin Latte to match the desktop.
# Used by rofimoji (emoji picker selector) and clipboard-pick (--dmenu).
# NOTE: fuzzel 1.15 requires rrggbbaa (alpha mandatory) - bare rrgbb is rejected.

[main]
font = JetBrainsMono Nerd Font:size=10

[colors]
background = eff1f5ff
text = 4c4f69ff
match = 8839efcc
selection = ccd0daff
selection-text = 4c4f69ff
selection-match = 8839efcc
border = 8839efff